name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require a changelog for the tag
        run: |
          if [ ! -f "changelogs/${GITHUB_REF_NAME}.md" ]; then
            echo "::error::changelogs/${GITHUB_REF_NAME}.md is missing; add it and re-tag."
            exit 1
          fi

      - name: Build the addon folder
        run: |
          mkdir -p output/BISListTooltip
          cp BISListTooltip.toc *.lua output/BISListTooltip/
          cp -r Data Libs output/BISListTooltip/
          # Lets the in-game version show the release instead of "dev".
          sed -i "s/^## Version: dev$/## Version: ${GITHUB_REF_NAME#v}/" output/BISListTooltip/BISListTooltip.toc
          grep -q "^## Version: ${GITHUB_REF_NAME#v}$" output/BISListTooltip/BISListTooltip.toc

      - name: Zip the addon
        working-directory: output
        run: zip -r "BISListTooltip-${GITHUB_REF_NAME}.zip" BISListTooltip

      - name: Build the CurseForge changelog
        run: python3 tools/generate-curseforge-changelog.py

      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "output/BISListTooltip-${GITHUB_REF_NAME}.zip" \
            output/curseforge-changelog.md \
            -F "changelogs/${GITHUB_REF_NAME}.md" \
            --title "$GITHUB_REF_NAME"

      # Skipped with a notice until the CURSEFORGE_API_TOKEN secret exists.
      - name: Publish to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
        run: |
          python3 tools/publish-curseforge.py \
            --tag "$GITHUB_REF_NAME" \
            --zip "output/BISListTooltip-${GITHUB_REF_NAME}.zip" \
            --changelog output/curseforge-changelog.md
