name: Release

on:
  push:
    tags:
      - "v*"
  # A tag pushed by a workflow doesn't start other workflows, so the automatic patch release calls this directly.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Require a changelog for the tag
        run: |
          if [ ! -f "changelogs/${TAG}.md" ]; then
            echo "::error::changelogs/${TAG}.md is missing; add it and re-tag."
            exit 1
          fi

      - name: Build the addon folder
        run: |
          mkdir -p output/BISListTooltip
          cp BISListTooltip.toc *.lua output/BISListTooltip/
          cp -r Data Libs output/BISListTooltip/
          # Lets the in-game version show the release instead of "dev".
          sed -i "s/^## Version: dev$/## Version: ${TAG#v}/" output/BISListTooltip/BISListTooltip.toc
          grep -q "^## Version: ${TAG#v}$" output/BISListTooltip/BISListTooltip.toc

      - name: Zip the addon
        working-directory: output
        run: zip -r "BISListTooltip-${TAG}.zip" BISListTooltip

      - name: Build the CurseForge changelog
        run: python3 tools/generate-curseforge-changelog.py

      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            "output/BISListTooltip-${TAG}.zip" \
            output/curseforge-changelog.md \
            -F "changelogs/${TAG}.md" \
            --title "$TAG"

      # Skipped with a notice until the CURSEFORGE_API_TOKEN secret exists.
      - name: Publish to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
        run: |
          python3 tools/publish-curseforge.py \
            --tag "$TAG" \
            --zip "output/BISListTooltip-${TAG}.zip" \
            --changelog output/curseforge-changelog.md
