name: Sync built-in lists

on:
  schedule:
    # Daily, shortly after bislist.io's own list imports at 14:00 UTC.
    - cron: "37 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-builtin
  cancel-in-progress: false

env:
  BRANCH: sync-builtin-lists

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the changelog is named after the next version, and an edited one is kept from the open PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Lua 5.1
        run: sudo apt-get install -y lua5.1

      # bash with pipefail, so a failed sync stops the run instead of hiding behind tee.
      - name: Sync from bislist.io
        shell: bash
        env:
          BISLIST_SYNC_KEY: ${{ secrets.BISLIST_SYNC_KEY }}
        run: python3 tools/sync-builtin.py | tee summary.txt

      # Pull requests opened by a workflow don't start CI, so the synced data is tested here.
      - name: Test the synced data
        run: |
          lua5.1 tests/run.lua
          python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Open, update or close the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if git diff --quiet -- Data; then
            echo "Built-in lists match bislist.io." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$existing" ]; then
              gh pr close "$existing" --delete-branch --comment "The built-in lists on bislist.io match main again."
            fi
            exit 0
          fi

          # The PR carries the changelog of the release that merging it makes, so it can be reviewed and edited first.
          latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v$major.$minor.$((patch + 1))"
          changelog="changelogs/$next.md"
          {
            echo "## $next"
            echo
            echo "Updated the built-in lists:"
            echo
            sed 's/^/* /' summary.txt
          } > generated.md

          # A changelog someone edited in the open PR is kept; the bot only rewrites its own.
          kept=false
          if git fetch -q origin "$BRANCH" 2>/dev/null && git cat-file -e "FETCH_HEAD:$changelog" 2>/dev/null; then
            last_author=$(git log -1 --format=%ae FETCH_HEAD -- "$changelog")
            if [ "$last_author" != "$BOT_EMAIL" ]; then
              git show "FETCH_HEAD:$changelog" > "$changelog"
              kept=true
            fi
          fi
          if [ "$kept" = false ]; then cp generated.md "$changelog"; fi

          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          git checkout -B "$BRANCH"
          git add Data "$changelog"
          git commit -q -m "Update built-in lists from bislist.io" -m "$(cat summary.txt)"
          git push -q --force origin "$BRANCH"
          {
            echo "The built-in lists changed on bislist.io:"
            echo
            sed 's/^/* /' summary.txt
            echo
            echo "**Merging this releases $next** to GitHub and CurseForge, with \`$changelog\` from this PR as its changelog. Review it under Files changed, and edit it there before merging if you want to."
            if [ "$kept" = true ]; then
              echo
              echo "The changelog was edited in this PR, so the daily sync kept your version. Today's generated text, in case the lists changed since:"
              echo
              sed 's/^/> /' generated.md
            fi
          } > body.md
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file body.md
          else
            gh pr create --head "$BRANCH" --title "Update built-in lists" --body-file body.md
          fi
          cat body.md >> "$GITHUB_STEP_SUMMARY"
