name: Release synced lists

# Merging an "Update built-in lists" PR is the approval: it releases the version whose changelog the PR carries.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.merged && github.event.pull_request.head.ref == 'sync-builtin-lists'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # The newest untagged vX.Y.Z changelog names the release; it must come after the latest tag.
      - name: Find the version to release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          next=$(ls changelogs | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.md$' | sed 's/\.md$//' | sort -V | tail -1)
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null || [ "$(printf '%s\n%s\n' "$latest" "$next" | sort -V | tail -1)" != "$next" ]; then
            echo "::error::No untagged changelog after $latest in this merge, so nothing was released. Add changelogs/vX.Y.Z.md and tag it by hand."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "$next"
          git push -q origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          {
            echo "Releasing $next:"
            echo
            cat "changelogs/$next.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # A tag pushed by a workflow doesn't start other workflows, so the release is called directly.
  release:
    needs: prepare
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
