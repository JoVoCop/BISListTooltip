name: Release synced lists

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.merged && github.event.pull_request.head.ref == 'sync-builtin-lists'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Work out the next patch version
        id: version
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          tagged=true
          if [ -z "$latest" ]; then
            # Before the first release the newest changelog stands in, so a dry run still shows what would happen.
            tagged=false
            latest=$(ls changelogs | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.md$' | sed 's/\.md$//' | sort -V | tail -1)
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v$major.$minor.$((patch + 1))"
          {
            echo "## $next"
            echo
            echo "Updated the built-in lists:"
            echo
            printf '%s\n' "$PR_BODY" | grep '^\* '
          } > "changelogs/$next.md"
          if [ "${{ vars.AUTO_RELEASE }}" != "true" ] || [ "$tagged" != true ]; then
            {
              if [ "$tagged" != true ]; then echo "$latest isn't tagged yet, so nothing is released; the first release is tagged by hand."; echo; fi
              echo "Dry run: would release $next after $latest with this changelog:"
              echo
              cat "changelogs/$next.md"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "changelogs/$next.md"
          git commit -q -m "Changelog for $next"
          git tag -a "$next" -m "$next"
          git push -q origin main "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
